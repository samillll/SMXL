<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMXL - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== DISABLE COPY ===== */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        ::selection {
            background: transparent;
        }
        ::-moz-selection {
            background: transparent;
        }

        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff6b00;
            border-radius: 20px;
        }

        .dash-wrapper {
            max-width: 100%;
            padding: 20px 16px 80px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0 16px;
            border-bottom: 1px solid rgba(255, 107, 0, 0.08);
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left .brand {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b00, #ff8c38);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .header-left .brand i {
            -webkit-text-fill-color: initial;
            color: #ff6b00;
            margin-right: 6px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 14px 6px 10px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .user-badge .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b00, #e65c00);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: #fff;
        }

        .user-badge .user-info {
            line-height: 1.2;
        }

        .user-badge .user-info .name {
            font-weight: 600;
            font-size: 13px;
        }

        .user-badge .user-info .role {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.35);
        }

        .btn-logout {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.3);
            padding: 8px 12px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: rgba(255, 68, 68, 0.12);
            border-color: rgba(255, 68, 68, 0.2);
            color: #ff4444;
        }

        /* ===== VIDEO ===== */
        .video-section {
            border-radius: 20px;
            overflow: hidden;
            margin: 16px 0 20px;
            background: #111;
            aspect-ratio: 16 / 9;
            max-height: 320px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 107, 0, 0.06);
        }

        .video-section video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ===== WELCOME ===== */
        .welcome-banner {
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.06), rgba(255, 107, 0, 0.01));
            border: 1px solid rgba(255, 107, 0, 0.06);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .welcome-banner .greeting {
            font-size: 16px;
            font-weight: 600;
        }

        .welcome-banner .greeting span {
            color: #ff6b00;
        }

        /* ===== JADWAL SHOLAT (HORIZONTAL SCROLL) ===== */
        .sholat-section {
            margin-bottom: 24px;
        }

        .sholat-section .section-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
        }

        .sholat-section .section-title i {
            color: #ff6b00;
        }

        .sholat-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 6px 4px 12px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .sholat-scroll::-webkit-scrollbar {
            height: 3px;
        }
        .sholat-scroll::-webkit-scrollbar-thumb {
            background: #ff6b00;
            border-radius: 20px;
        }

        .sholat-item {
            min-width: 130px;
            flex-shrink: 0;
            scroll-snap-align: start;
            border-radius: 16px;
            padding: 18px 14px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: transform 0.3s ease;
            cursor: default;
            pointer-events: none;
            user-select: none;
        }

        .sholat-item .sholat-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            filter: blur(2px);
            transition: opacity 0.4s ease;
        }

        .sholat-item .sholat-content {
            position: relative;
            z-index: 1;
        }

        .sholat-item .sholat-icon {
            font-size: 20px;
            color: #ff6b00;
            opacity: 0.5;
            margin-bottom: 4px;
        }

        .sholat-item .sholat-name {
            font-size: 12px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .sholat-item .sholat-time {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            margin-top: 2px;
        }

        /* Background masjid berbeda */
        .sholat-item:nth-child(1) .sholat-bg {
            background-image: url('https://images.unsplash.com/photo-1584558617962-ff8b900c5f7e?w=300&h=400&fit=crop&crop=center');
        }
        .sholat-item:nth-child(2) .sholat-bg {
            background-image: url('https://images.unsplash.com/photo-1564770553735-199c7eb2db1a?w=300&h=400&fit=crop&crop=center');
        }
        .sholat-item:nth-child(3) .sholat-bg {
            background-image: url('https://images.unsplash.com/photo-1584558617962-ff8b900c5f7e?w=300&h=400&fit=crop&crop=center');
        }
        .sholat-item:nth-child(4) .sholat-bg {
            background-image: url('https://images.unsplash.com/photo-1564770553735-199c7eb2db1a?w=300&h=400&fit=crop&crop=center');
        }
        .sholat-item:nth-child(5) .sholat-bg {
            background-image: url('https://images.unsplash.com/photo-1584558617962-ff8b900c5f7e?w=300&h=400&fit=crop&crop=center');
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 107, 0, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0 env(safe-area-inset-bottom);
            z-index: 999;
            height: 68px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
            font-size: 10px;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 4px 16px;
            border-radius: 12px;
            cursor: pointer;
            border: none;
            background: none;
            font-family: 'Inter', sans-serif;
            position: relative;
        }

        .nav-item i {
            font-size: 22px;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: #ff6b00;
        }

        .nav-item.active i {
            transform: translateY(-2px);
        }

        .nav-item:hover {
            color: rgba(255, 255, 255, 0.5);
        }

        .nav-item .nav-badge {
            position: absolute;
            top: 0;
            right: 4px;
            background: #ff6b00;
            color: #fff;
            font-size: 8px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 20px;
            min-width: 16px;
            text-align: center;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .dash-wrapper {
                padding: 12px 12px 80px;
            }
            .header-left .brand {
                font-size: 20px;
            }
            .user-badge .user-info .name {
                font-size: 12px;
            }
            .sholat-item {
                min-width: 110px;
                padding: 14px 10px;
            }
            .sholat-item .sholat-time {
                font-size: 18px;
            }
            .video-section {
                max-height: 200px;
            }
            .bottom-nav {
                height: 60px;
                padding: 4px 0 env(safe-area-inset-bottom);
            }
            .nav-item {
                font-size: 9px;
                padding: 2px 10px;
            }
            .nav-item i {
                font-size: 18px;
            }
        }
    </style>

    <!-- ===== DISABLE RIGHT CLICK & COPY ===== -->
    <script>
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 'i' || e.key === 'j')) {
                e.preventDefault();
                return false;
            }
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
        });
    </script>
</head>
<body>

    <div class="dash-wrapper">

        <!-- ===== HEADER ===== -->
        <header class="header">
            <div class="header-left">
                <div class="brand">
                    <i class="fas fa-bolt"></i> SMXL
                </div>
            </div>
            <div class="header-right">
                <div class="user-badge">
                    <div class="avatar" id="avatarLetter">A</div>
                    <div class="user-info">
                        <div class="name" id="displayName">User</div>
                        <div class="role" id="displayRole">Member</div>
                    </div>
                </div>
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <!-- ===== VIDEO ===== -->
        <div class="video-section">
            <video autoplay muted loop playsinline>
                <source src="https://videotourl.com/videos/1788443089047-cab6adc6-7b2c-4a53-bb05-50e7714a1f27.mp4" type="video/mp4" />
            </video>
        </div>

        <!-- ===== WELCOME ===== -->
        <div class="welcome-banner">
            <div class="greeting">
                <i class="fas fa-hand-wave" style="color:#ff6b00;margin-right:8px;"></i>
                Welcome, <span id="welcomeName">User</span>
            </div>
            <div style="display:flex;align-items:center;gap:12px;font-size:13px;color:rgba(255,255,255,0.3);">
                <i class="fas fa-user-tag"></i> <span id="welcomeRole">Member</span>
            </div>
        </div>

        <!-- ===== JADWAL SHOLAT (HORIZONTAL SCROLL) ===== -->
        <div class="sholat-section">
            <div class="section-title">
                <i class="fas fa-mosque"></i> Jadwal Sholat
                <span style="font-weight:400;color:rgba(255,255,255,0.15);font-size:11px;">WIB</span>
            </div>
            <div class="sholat-scroll" id="sholatScroll">
                <div class="sholat-item">
                    <div class="sholat-bg"></div>
                    <div class="sholat-content">
                        <div class="sholat-icon"><i class="fas fa-cloud-sun"></i></div>
                        <div class="sholat-name">Subuh</div>
                        <div class="sholat-time" id="timeSubuh">04:30</div>
                    </div>
                </div>
                <div class="sholat-item">
                    <div class="sholat-bg"></div>
                    <div class="sholat-content">
                        <div class="sholat-icon"><i class="fas fa-sun"></i></div>
                        <div class="sholat-name">Zuhur</div>
                        <div class="sholat-time" id="timeZuhur">12:00</div>
                    </div>
                </div>
                <div class="sholat-item">
                    <div class="sholat-bg"></div>
                    <div class="sholat-content">
                        <div class="sholat-icon"><i class="fas fa-sun"></i></div>
                        <div class="sholat-name">Ashar</div>
                        <div class="sholat-time" id="timeAshar">15:30</div>
                    </div>
                </div>
                <div class="sholat-item">
                    <div class="sholat-bg"></div>
                    <div class="sholat-content">
                        <div class="sholat-icon"><i class="fas fa-moon"></i></div>
                        <div class="sholat-name">Maghrib</div>
                        <div class="sholat-time" id="timeMaghrib">18:00</div>
                    </div>
                </div>
                <div class="sholat-item">
                    <div class="sholat-bg"></div>
                    <div class="sholat-content">
                        <div class="sholat-icon"><i class="fas fa-moon"></i></div>
                        <div class="sholat-name">Isya</div>
                        <div class="sholat-time" id="timeIsya">19:30</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== BOTTOM NAV ===== -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="navAction('home')" id="navHome">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </button>
        <button class="nav-item" onclick="navAction('qris')" id="navQris">
            <i class="fas fa-qrcode"></i>
            <span>Qris</span>
            <span class="nav-badge">NEW</span>
        </button>
        <button class="nav-item" onclick="navAction('settings')" id="navSettings">
            <i class="fas fa-cog"></i>
            <span>Setting</span>
        </button>
    </nav>

    <script>
        // ============================================================
        // LOAD USER DATA
        // ============================================================
        function loadUserData() {
            const username = sessionStorage.getItem('smxl_user');
            const role = sessionStorage.getItem('smxl_role') || 'Member';

            if (!username) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('displayName').textContent = username;
            document.getElementById('displayRole').textContent = role;
            document.getElementById('welcomeName').textContent = username;
            document.getElementById('welcomeRole').textContent = role;
            document.getElementById('avatarLetter').textContent = username.charAt(0).toUpperCase();
        }

        // ============================================================
        // LOGOUT
        // ============================================================
        function logout() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        // ============================================================
        // NAVIGATION
        // ============================================================
        function navAction(target) {
            // Reset semua nav
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            // Aktifkan yang diklik
            if (target === 'home') {
                document.getElementById('navHome').classList.add('active');
                alert('🏠 Anda berada di halaman Home');
            } else if (target === 'qris') {
                document.getElementById('navQris').classList.add('active');
                alert('📱 Fitur QRIS akan segera hadir!');
            } else if (target === 'settings') {
                document.getElementById('navSettings').classList.add('active');
                alert('⚙️ Halaman Setting sedang dalam pengembangan.');
            }
        }

        // ============================================================
        // JADWAL SHOLAT
        // ============================================================
        function updateSholatTimes() {
            const now = new Date();
            const hours = now.getHours();
            const mins = now.getMinutes();

            const times = {
                subuh: '04:30',
                zuhur: '12:00',
                ashar: '15:30',
                maghrib: '18:00',
                isya: '19:30'
            };

            document.getElementById('timeSubuh').textContent = times.subuh;
            document.getElementById('timeZuhur').textContent = times.zuhur;
            document.getElementById('timeAshar').textContent = times.ashar;
            document.getElementById('timeMaghrib').textContent = times.maghrib;
            document.getElementById('timeIsya').textContent = times.isya;

            const currentTime = hours * 60 + mins;
            const sholatTimes = [
                { id: 'timeSubuh', time: 4 * 60 + 30 },
                { id: 'timeZuhur', time: 12 * 60 + 0 },
                { id: 'timeAshar', time: 15 * 60 + 30 },
                { id: 'timeMaghrib', time: 18 * 60 + 0 },
                { id: 'timeIsya', time: 19 * 60 + 30 }
            ];

            sholatTimes.forEach((s) => {
                const el = document.getElementById(s.id);
                if (currentTime >= s.time) {
                    el.style.color = '#ff6b00';
                } else {
                    el.style.color = '#ffffff';
                }
            });
        }

        // ============================================================
        // INIT
        // ============================================================
        loadUserData();
        updateSholatTimes();
        setInterval(updateSholatTimes, 60000);

        // Cegah back setelah logout
        window.addEventListener('pageshow', function(e) {
            if (e.persisted) {
                const user = sessionStorage.getItem('smxl_user');
                if (!user) {
                    window.location.href = 'index.html';
                }
            }
        });
    </script>

</body>
                                                                           </html>
