<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMXL - Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== DISABLE COPY & TAP HIGHLIGHT ===== */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            outline: none !important;
        }

        ::selection {
            background: transparent;
        }
        ::-moz-selection {
            background: transparent;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            padding-bottom: 80px;
            -webkit-tap-highlight-color: transparent !important;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff6b00;
            border-radius: 20px;
        }

        .dash-wrapper {
            max-width: 100%;
            padding: 16px 16px 80px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 14px;
            border-bottom: 1px solid rgba(255, 107, 0, 0.08);
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-left .brand {
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b00, #ff8c38);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .header-left .brand i {
            -webkit-text-fill-color: initial;
            color: #ff6b00;
            margin-right: 6px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 14px 6px 10px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .user-badge .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b00, #e65c00);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
            color: #fff;
        }

        .user-badge .user-info {
            line-height: 1.2;
        }

        .user-badge .user-info .name {
            font-weight: 600;
            font-size: 13px;
        }

        .user-badge .user-info .role {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.35);
        }

        .btn-logout {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.3);
            padding: 8px 12px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        .btn-logout:hover {
            background: rgba(255, 68, 68, 0.12);
            border-color: rgba(255, 68, 68, 0.2);
            color: #ff4444;
        }

        .btn-logout:active {
            transform: scale(0.95);
        }

        /* ===== VIDEO FULL WIDTH ===== */
        .video-section {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            margin: 14px 0 18px;
            background: #111;
            aspect-ratio: 16 / 9;
            max-height: 380px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 107, 0, 0.06);
        }

        .video-section video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ===== WELCOME ===== */
        .welcome-banner {
            background: linear-gradient(135deg, rgba(255, 107, 0, 0.06), rgba(255, 107, 0, 0.01));
            border: 1px solid rgba(255, 107, 0, 0.06);
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .welcome-banner .greeting {
            font-size: 15px;
            font-weight: 600;
        }

        .welcome-banner .greeting span {
            color: #ff6b00;
        }

        .welcome-banner .role-badge {
            font-size: 11px;
            padding: 4px 14px;
            border-radius: 20px;
            background: rgba(255, 107, 0, 0.1);
            color: #ff6b00;
            font-weight: 600;
        }

        /* ===== JADWAL SHOLAT ===== */
        .sholat-section {
            margin-bottom: 20px;
        }

        .sholat-section .section-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
        }

        .sholat-section .section-title i {
            color: #ff6b00;
        }

        .sholat-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding: 4px 2px 10px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .sholat-scroll::-webkit-scrollbar {
            height: 3px;
        }
        .sholat-scroll::-webkit-scrollbar-thumb {
            background: #ff6b00;
            border-radius: 20px;
        }

        .sholat-item {
            min-width: 110px;
            flex-shrink: 0;
            scroll-snap-align: start;
            border-radius: 16px;
            padding: 16px 12px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: default;
            pointer-events: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent !important;
        }

        .sholat-item .sholat-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            opacity: 0.12;
            filter: blur(2px);
        }

        .sholat-item .sholat-content {
            position: relative;
            z-index: 1;
        }

        .sholat-item .sholat-icon {
            font-size: 18px;
            color: #ff6b00;
            opacity: 0.5;
            margin-bottom: 2px;
        }

        .sholat-item .sholat-name {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .sholat-item .sholat-time {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            margin-top: 2px;
        }

        /* Background masjid berbeda */
        .sholat-item:nth-child(1) .sholat-bg {
            background-image: url('https://images.unsplash.com/photo-1584558617962-ff8b900c5f7e?w=300&h=400&fit=crop&crop=center');
        }
        .sholat-item:nth-child(2) .sholat-bg {
            background-image: url('https://images.unsplash.com/photo-1564770553735-199c7eb2db1a?w=300&h=400&fit=crop&crop=center');
        }
        .sholat-item:nth-child(3) .sholat-bg {
            background-image: url('https://images.unsplash.com/photo-1584558617962-ff8b900c5f7e?w=300&h=400&fit=crop&crop=center');
        }
        .sholat-item:nth-child(4) .sholat-bg {
            background-image: url('https://images.unsplash.com/photo-1564770553735-199c7eb2db1a?w=300&h=400&fit=crop&crop=center');
        }
        .sholat-item:nth-child(5) .sholat-bg {
            background-image: url('https://images.unsplash.com/photo-1584558617962-ff8b900c5f7e?w=300&h=400&fit=crop&crop=center');
        }

        /* ===== BERITA ===== */
        .berita-section {
            margin-bottom: 20px;
        }

        .berita-section .section-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
        }

        .berita-section .section-title i {
            color: #ff6b00;
        }

        .berita-scroll {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 4px 2px 10px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .berita-scroll::-webkit-scrollbar {
            height: 3px;
        }
        .berita-scroll::-webkit-scrollbar-thumb {
            background: #ff6b00;
            border-radius: 20px;
        }

        .berita-item {
            min-width: 260px;
            flex-shrink: 0;
            scroll-snap-align: start;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            padding: 14px 16px;
            transition: all 0.3s ease;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        .berita-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 107, 0, 0.1);
        }

        .berita-item:active {
            transform: scale(0.98);
        }

        .berita-item .berita-sumber {
            font-size: 10px;
            color: #ff6b00;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .berita-item .berita-sumber i {
            font-size: 10px;
        }

        .berita-item .berita-judul {
            font-size: 13px;
            font-weight: 600;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            color: rgba(255, 255, 255, 0.85);
        }

        .berita-item .berita-waktu {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 6px;
        }

        .berita-item .berita-thumb {
            width: 100%;
            height: 80px;
            border-radius: 10px;
            background-size: cover;
            background-position: center;
            margin-bottom: 8px;
            background-color: rgba(255, 255, 255, 0.03);
        }

        .berita-loading {
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            padding: 12px;
            text-align: center;
            min-width: 200px;
        }

        /* ===== MENU SECTION — GRID ===== */
        .menu-grid-section {
            margin-top: 10px;
        }

        .menu-grid-section .section-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
        }

        .menu-grid-section .section-title i {
            color: #ff6b00;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .menu-grid .menu-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            padding: 24px 16px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        .menu-grid .menu-card:hover {
            background: rgba(255, 107, 0, 0.04);
            border-color: rgba(255, 107, 0, 0.1);
            transform: translateY(-3px);
        }

        .menu-grid .menu-card:active {
            transform: scale(0.95);
        }

        .menu-grid .menu-card .menu-icon {
            font-size: 32px;
            color: #ff6b00;
            margin-bottom: 8px;
        }

        .menu-grid .menu-card .menu-name {
            font-size: 14px;
            font-weight: 600;
        }

        .menu-grid .menu-card .menu-desc {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 2px;
        }

        .menu-grid .menu-card .menu-badge {
            font-size: 9px;
            font-weight: 700;
            padding: 2px 12px;
            border-radius: 20px;
            background: rgba(255, 107, 0, 0.12);
            color: #ff6b00;
            display: inline-block;
            margin-top: 6px;
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 10, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 107, 0, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 0 env(safe-area-inset-bottom);
            z-index: 999;
            height: 64px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            color: rgba(255, 255, 255, 0.2);
            text-decoration: none;
            font-size: 9px;
            font-weight: 500;
            transition: all 0.3s ease;
            padding: 4px 16px;
            border-radius: 12px;
            cursor: pointer;
            border: none;
            background: none;
            font-family: 'Inter', sans-serif;
            position: relative;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        .nav-item i {
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: #ff6b00;
        }

        .nav-item.active i {
            transform: translateY(-2px);
        }

        .nav-item:hover {
            color: rgba(255, 255, 255, 0.5);
        }

        .nav-item:active {
            transform: scale(0.92);
        }

        .nav-item .nav-badge {
            position: absolute;
            top: 0;
            right: 4px;
            background: #ff6b00;
            color: #fff;
            font-size: 7px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 20px;
            min-width: 14px;
            text-align: center;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .dash-wrapper {
                padding: 10px 10px 80px;
            }
            .header-left .brand {
                font-size: 18px;
            }
            .user-badge .user-info .name {
                font-size: 12px;
            }
            .sholat-item {
                min-width: 100px;
                padding: 12px 10px;
            }
            .sholat-item .sholat-time {
                font-size: 17px;
            }
            .video-section {
                max-height: 220px;
                border-radius: 12px;
                margin: 10px 0 14px;
            }
            .berita-item {
                min-width: 220px;
                padding: 12px 14px;
            }
            .berita-item .berita-thumb {
                height: 60px;
            }
            .menu-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .menu-grid .menu-card {
                padding: 18px 12px;
            }
            .menu-grid .menu-card .menu-icon {
                font-size: 26px;
            }
            .bottom-nav {
                height: 56px;
                padding: 4px 0 env(safe-area-inset-bottom);
            }
            .nav-item {
                font-size: 8px;
                padding: 2px 10px;
            }
            .nav-item i {
                font-size: 17px;
            }
        }
    </style>

    <!-- DISABLE COPY & RIGHT CLICK -->
    <script>
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 'i' || e.key === 'j')) {
                e.preventDefault();
                return false;
            }
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
        });
        document.addEventListener('touchstart', function() {}, { passive: true });
    </script>
</head>
<body>

    <div class="dash-wrapper">

        <!-- HEADER -->
        <header class="header">
            <div class="header-left">
                <div class="brand">
                    <i class="fas fa-bolt"></i> SMXL
                </div>
            </div>
            <div class="header-right">
                <div class="user-badge">
                    <div class="avatar" id="avatarLetter">A</div>
                    <div class="user-info">
                        <div class="name" id="displayName">User</div>
                        <div class="role" id="displayRole">Member</div>
                    </div>
                </div>
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <!-- VIDEO FULL WIDTH -->
        <div class="video-section">
            <video autoplay muted loop playsinline>
                <source src="https://videotourl.com/videos/1788443089047-cab6adc6-7b2c-4a53-bb05-50e7714a1f27.mp4" type="video/mp4" />
            </video>
        </div>

        <!-- WELCOME -->
        <div class="welcome-banner">
            <div class="greeting">
                <i class="fas fa-hand-wave" style="color:#ff6b00;margin-right:8px;"></i>
                Welcome, <span id="welcomeName">User</span>
            </div>
            <span class="role-badge" id="welcomeRole">Member</span>
        </div>

        <!-- JADWAL SHOLAT (SCROLL) -->
        <div class="sholat-section">
            <div class="section-title">
                <i class="fas fa-mosque"></i> Jadwal Sholat
                <span style="font-weight:400;color:rgba(255,255,255,0.12);font-size:10px;">WIB</span>
            </div>
            <div class="sholat-scroll">
                <div class="sholat-item">
                    <div class="sholat-bg"></div>
                    <div class="sholat-content">
                        <div class="sholat-icon"><i class="fas fa-cloud-sun"></i></div>
                        <div class="sholat-name">Subuh</div>
                        <div class="sholat-time" id="timeSubuh">04:30</div>
                    </div>
                </div>
                <div class="sholat-item">
                    <div class="sholat-bg"></div>
                    <div class="sholat-content">
                        <div class="sholat-icon"><i class="fas fa-sun"></i></div>
                        <div class="sholat-name">Zuhur</div>
                        <div class="sholat-time" id="timeZuhur">12:00</div>
                    </div>
                </div>
                <div class="sholat-item">
                    <div class="sholat-bg"></div>
                    <div class="sholat-content">
                        <div class="sholat-icon"><i class="fas fa-sun"></i></div>
                        <div class="sholat-name">Ashar</div>
                        <div class="sholat-time" id="timeAshar">15:30</div>
                    </div>
                </div>
                <div class="sholat-item">
                    <div class="sholat-bg"></div>
                    <div class="sholat-content">
                        <div class="sholat-icon"><i class="fas fa-moon"></i></div>
                        <div class="sholat-name">Maghrib</div>
                        <div class="sholat-time" id="timeMaghrib">18:00</div>
                    </div>
                </div>
                <div class="sholat-item">
                    <div class="sholat-bg"></div>
                    <div class="sholat-content">
                        <div class="sholat-icon"><i class="fas fa-moon"></i></div>
                        <div class="sholat-name">Isya</div>
                        <div class="sholat-time" id="timeIsya">19:30</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- BERITA TERKINI (SCROLL) -->
        <div class="berita-section">
            <div class="section-title">
                <i class="fas fa-newspaper"></i> Berita Terkini
            </div>
            <div class="berita-scroll" id="beritaContainer">
                <div class="berita-loading">
                    <i class="fas fa-spinner fa-spin"></i> Memuat berita...
                </div>
            </div>
        </div>

        <!-- MENU GRID (4 MENU — LANGSUNG KE HALAMAN) -->
        <div class="menu-grid-section">
            <div class="section-title">
                <i class="fas fa-th-large"></i> Menu
            </div>
            <div class="menu-grid">

                <!-- BUG → ke menu.html (atau halaman sendiri) -->
                <div class="menu-card" onclick="goTo('menu')">
                    <div class="menu-icon"><i class="fas fa-bug"></i></div>
                    <div class="menu-name">BUG</div>
                    <div class="menu-desc">Lapor & cek bug</div>
                    <span class="menu-badge">NEW</span>
                </div>

                <!-- TRACKER → placeholder -->
                <div class="menu-card" onclick="goTo('tracker')">
                    <div class="menu-icon"><i class="fas fa-map-pin"></i></div>
                    <div class="menu-name">TRACKER</div>
                    <div class="menu-desc">Lacak status & lokasi</div>
                    <span class="menu-badge">LIVE</span>
                </div>

                <!-- SENDER → LANGSUNG KE sender.html -->
                <div class="menu-card" onclick="goTo('sender')">
                    <div class="menu-icon"><i class="fas fa-paper-plane"></i></div>
                    <div class="menu-name">SENDER</div>
                    <div class="menu-desc">Kirim pesan massal</div>
                    <span class="menu-badge">PRO</span>
                </div>

                <!-- TABUNGANKU → placeholder -->
                <div class="menu-card" onclick="goTo('tabungaku')">
                    <div class="menu-icon"><i class="fas fa-piggy-bank"></i></div>
                    <div class="menu-name">TABUNGANKU</div>
                    <div class="menu-desc">Kelola tabungan</div>
                    <span class="menu-badge">SALDO</span>
                </div>

            </div>
        </div>

    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="navAction('home')" id="navHome">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </button>
        <button class="nav-item" onclick="navAction('menu')" id="navMenu">
            <i class="fas fa-th-large"></i>
            <span>Menu</span>
        </button>
        <button class="nav-item" onclick="navAction('settings')" id="navSettings">
            <i class="fas fa-cog"></i>
            <span>Setting</span>
        </button>
    </nav>

    <script>
        // ============================================================
        // LOAD USER DATA
        // ============================================================
        function loadUserData() {
            const username = sessionStorage.getItem('smxl_user');
            const role = sessionStorage.getItem('smxl_role') || 'Member';

            if (!username) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('displayName').textContent = username;
            document.getElementById('displayRole').textContent = role;
            document.getElementById('welcomeName').textContent = username;
            document.getElementById('welcomeRole').textContent = role;
            document.getElementById('avatarLetter').textContent = username.charAt(0).toUpperCase();
        }

        // ============================================================
        // LOGOUT
        // ============================================================
        function logout() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        // ============================================================
        // NAVIGATION BOTTOM
        // ============================================================
        function navAction(target) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            if (target === 'home') {
                document.getElementById('navHome').classList.add('active');
            } else if (target === 'menu') {
                document.getElementById('navMenu').classList.add('active');
                window.location.href = 'menu.html';
            } else if (target === 'settings') {
                document.getElementById('navSettings').classList.add('active');
                alert('⚙️ Halaman Setting sedang dalam pengembangan.');
            }
        }

        // ============================================================
        // MENU GRID — LANGSUNG KE HALAMAN
        // ============================================================
        function goTo(page) {
            if (page === 'menu') {
                window.location.href = 'menu.html';
            } else if (page === 'sender') {
                window.location.href = 'sender.html';
            } else if (page === 'tracker') {
                alert('📍 Tracker akan segera hadir!');
            } else if (page === 'tabungaku') {
                alert('💰 Tabungaku akan segera hadir!');
            } else {
                alert('🔧 Halaman sedang dalam pengembangan.');
            }
        }

        // ============================================================
        // JADWAL SHOLAT
        // ============================================================
        function updateSholatTimes() {
            const now = new Date();
            const hours = now.getHours();
            const mins = now.getMinutes();

            const times = {
                subuh: '04:30',
                zuhur: '12:00',
                ashar: '15:30',
                maghrib: '18:00',
                isya: '19:30'
            };

            document.getElementById('timeSubuh').textContent = times.subuh;
            document.getElementById('timeZuhur').textContent = times.zuhur;
            document.getElementById('timeAshar').textContent = times.ashar;
            document.getElementById('timeMaghrib').textContent = times.maghrib;
            document.getElementById('timeIsya').textContent = times.isya;

            const currentTime = hours * 60 + mins;
            const sholatTimes = [
                { id: 'timeSubuh', time: 4 * 60 + 30 },
                { id: 'timeZuhur', time: 12 * 60 + 0 },
                { id: 'timeAshar', time: 15 * 60 + 30 },
                { id: 'timeMaghrib', time: 18 * 60 + 0 },
                { id: 'timeIsya', time: 19 * 60 + 30 }
            ];

            sholatTimes.forEach((s) => {
                const el = document.getElementById(s.id);
                if (currentTime >= s.time) {
                    el.style.color = '#ff6b00';
                } else {
                    el.style.color = '#ffffff';
                }
            });
        }

        // ============================================================
        // BERITA TERKINI (RSS Google News)
        // ============================================================
        async function loadBerita() {
            const container = document.getElementById('beritaContainer');

            try {
                const rssUrl = 'https://news.google.com/rss?hl=id&gl=ID&ceid=ID:id';
                const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;

                const res = await fetch(proxyUrl);
                if (!res.ok) throw new Error('Gagal fetch berita');

                const data = await res.json();

                if (!data.items || data.items.length === 0) {
                    container.innerHTML = `
                        <div class="berita-loading" style="color:rgba(255,255,255,0.15);">
                            <i class="fas fa-exclamation-circle"></i> Tidak ada berita
                        </div>
                    `;
                    return;
                }

                const items = data.items.slice(0, 10);

                let html = '';
                items.forEach((item) => {
                    let thumb = '';
                    if (item.thumbnail) {
                        thumb = item.thumbnail;
                    } else if (item.description) {
                        const match = item.description.match(/<img[^>]+src="([^">]+)"/);
                        if (match) thumb = match[1];
                    }

                    let source = 'Google News';
                    if (item.source) source = item.source;

                    const pubDate = new Date(item.pubDate);
                    const timeAgo = new Date() - pubDate;
                    const minutes = Math.floor(timeAgo / 60000);
                    let waktu = 'Baru saja';
                    if (minutes > 60) {
                        const hours = Math.floor(minutes / 60);
                        waktu = hours + ' jam lalu';
                    } else if (minutes > 0) {
                        waktu = minutes + ' menit lalu';
                    }

                    html += `
                        <div class="berita-item" onclick="window.open('${item.link}','_blank')">
                            ${thumb ? `<div class="berita-thumb" style="background-image:url('${thumb}');"></div>` : ''}
                            <div class="berita-sumber">
                                <i class="fas fa-circle" style="font-size:6px;"></i>
                                ${source}
                            </div>
                            <div class="berita-judul">${item.title}</div>
                            <div class="berita-waktu">
                                <i class="far fa-clock"></i> ${waktu}
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

            } catch (err) {
                console.warn('Gagal load berita:', err);
                container.innerHTML = `
                    <div class="berita-loading" style="color:rgba(255,255,255,0.15);">
                        <i class="fas fa-exclamation-circle"></i> Gagal memuat berita
                    </div>
                `;
            }
        }

        // ============================================================
        // INIT
        // ============================================================
        loadUserData();
        updateSholatTimes();
        setInterval(updateSholatTimes, 60000);
        loadBerita();

        window.addEventListener('pageshow', function(e) {
            if (e.persisted) {
                const user = sessionStorage.getItem('smxl_user');
                if (!user) {
                    window.location.href = 'index.html';
                }
            }
        });
    </script>

</body>
