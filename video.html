<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SMXL - Video</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            outline: none !important;
        }

        ::selection {
            background: transparent;
        }
        ::-moz-selection {
            background: transparent;
        }

        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
            -webkit-tap-highlight-color: transparent !important;
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0a0a0a;
            z-index: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #0a0a0a;
        }

        /* ===== LOADING ===== */
        .video-loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            color: rgba(255, 255, 255, 0.2);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .video-loading i {
            font-size: 32px;
            color: #ff6b00;
            animation: spinLoading 1s linear infinite;
        }

        .video-loading span {
            letter-spacing: 1px;
            font-weight: 400;
        }

        .video-loading.hidden {
            opacity: 0;
        }

        /* ===== ERROR ===== */
        .video-error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            color: rgba(255, 255, 255, 0.15);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            text-align: center;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .video-error i {
            font-size: 48px;
            color: #ff4444;
            opacity: 0.3;
        }

        .video-error.show {
            display: flex;
        }

        @keyframes spinLoading {
            to { transform: rotate(360deg); }
        }

        .skip-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 10px 22px;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
            user-select: none;
        }

        .skip-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .skip-btn:active {
            transform: scale(0.95);
        }

        .sound-btn {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 10px 20px;
            color: rgba(255, 255, 255, 0.3);
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
            user-select: none;
        }

        .sound-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .sound-btn:active {
            transform: scale(0.95);
        }

        .sound-btn i {
            font-size: 16px;
        }

        .tap-indicator {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            color: rgba(255, 255, 255, 0.06);
            font-size: 11px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulseText 2.5s ease infinite;
            pointer-events: none;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.05; }
            50% { opacity: 0.2; }
        }

        .progress-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 3px;
            background: linear-gradient(90deg, #ff6b00, #ff8c38);
            z-index: 5;
            width: 0%;
            transition: width 0.3s linear;
            opacity: 0.5;
        }

        @media (max-width: 480px) {
            .skip-btn {
                top: 16px;
                right: 16px;
                padding: 8px 16px;
                font-size: 12px;
            }
            .sound-btn {
                bottom: 70px;
                padding: 8px 16px;
                font-size: 11px;
            }
            .tap-indicator {
                bottom: 30px;
                font-size: 10px;
            }
            .video-loading i {
                font-size: 28px;
            }
        }
    </style>

    <script>
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 'i' || e.key === 'j')) {
                e.preventDefault();
                return false;
            }
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
        });
        document.addEventListener('touchstart', function() {}, { passive: true });
    </script>
</head>
<body>

    <div class="video-container" id="videoContainer">
        <!-- LOADING -->
        <div class="video-loading" id="videoLoading">
            <i class="fas fa-spinner"></i>
            <span>Memuat video...</span>
        </div>

        <!-- ERROR -->
        <div class="video-error" id="videoError">
            <i class="fas fa-exclamation-triangle"></i>
            <span>Gagal memuat video<br>Klik SKIP untuk melanjutkan</span>
        </div>

        <!-- VIDEO — MULTIPLE SOURCE -->
        <video id="introVideo" preload="auto" playsinline>
            <!-- SOURCE 1: URL LO -->
            <source src="https://videotourl.com/videos/1788563768147-b276a4ee-cb6d-4da6-ad85-9f6bfbad7e20.mp4" type="video/mp4" />
            <!-- SOURCE 2: FALLBACK (DIRECT MP4) -->
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4" />
            <!-- SOURCE 3: ALTERNATIVE FALLBACK -->
            <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4" />
        </video>
    </div>

    <!-- SKIP -->
    <button class="skip-btn" id="skipBtn">
        <i class="fas fa-forward"></i> SKIP
    </button>

    <!-- SOUND -->
    <button class="sound-btn" id="soundBtn">
        <i class="fas fa-volume-up" id="soundIcon"></i>
        <span class="sound-label" id="soundLabel">Suara: ON</span>
    </button>

    <!-- PROGRESS -->
    <div class="progress-bar" id="progressBar"></div>

    <!-- TAP -->
    <div class="tap-indicator">
        <i class="fas fa-hand-pointer"></i> Tap anywhere to skip
    </div>

    <script>
        // ============================================================
        // CEK SESSION
        // ============================================================
        const username = sessionStorage.getItem('smxl_user');
        if (!username) {
            window.location.href = 'index.html';
        }

        // ============================================================
        // REFS
        // ============================================================
        const video = document.getElementById('introVideo');
        const skipBtn = document.getElementById('skipBtn');
        const soundBtn = document.getElementById('soundBtn');
        const soundIcon = document.getElementById('soundIcon');
        const soundLabel = document.getElementById('soundLabel');
        const progressBar = document.getElementById('progressBar');
        const videoContainer = document.getElementById('videoContainer');
        const videoLoading = document.getElementById('videoLoading');
        const videoError = document.getElementById('videoError');

        // ============================================================
        // STATE
        // ============================================================
        let isMuted = false;
        let isRedirecting = false;
        let hasError = false;
        video.muted = false;

        // ============================================================
        // SKIP KE DASHBOARD
        // ============================================================
        function goToDashboard() {
            if (isRedirecting) return;
            isRedirecting = true;
            window.location.href = 'dashboard.html';
        }

        skipBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            goToDashboard();
        });

        videoContainer.addEventListener('click', function() {
            goToDashboard();
        });

        video.addEventListener('ended', function() {
            goToDashboard();
        });

        // ============================================================
        // VIDEO MULAI PLAY → HIDE LOADING
        // ============================================================
        video.addEventListener('playing', function() {
            videoLoading.classList.add('hidden');
            video.muted = false;
            hasError = false;
        });

        // ============================================================
        // VIDEO ERROR → TAMPILKAN ERROR + FALLBACK
        // ============================================================
        video.addEventListener('error', function(e) {
            console.warn('Video error:', e);
            if (hasError) return;
            hasError = true;

            videoLoading.classList.add('hidden');
            videoError.classList.add('show');

            // COBA FALLBACK: pindah ke source berikutnya
            const sources = video.querySelectorAll('source');
            let currentSrc = video.currentSrc;

            for (let i = 0; i < sources.length; i++) {
                if (sources[i].src === currentSrc) {
                    if (i + 1 < sources.length) {
                        video.src = sources[i + 1].src;
                        video.load();
                        video.play().catch(function() {});
                        videoError.classList.remove('show');
                        videoLoading.classList.remove('hidden');
                        hasError = false;
                        break;
                    }
                }
            }

            // Kalo semua source gagal, kasih tombol skip otomatis setelah 3 detik
            setTimeout(function() {
                if (!isRedirecting) {
                    goToDashboard();
                }
            }, 5000);
        });

        // ============================================================
        // PROGRESS BAR
        // ============================================================
        video.addEventListener('timeupdate', function() {
            if (video.duration > 0) {
                const progress = (video.currentTime / video.duration) * 100;
                progressBar.style.width = progress + '%';
            }
        });

        // ============================================================
        // SOUND TOGGLE
        // ============================================================
        soundBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            isMuted = !isMuted;
            video.muted = isMuted;

            if (isMuted) {
                soundIcon.className = 'fas fa-volume-mute';
                soundLabel.textContent = 'Suara: OFF';
            } else {
                soundIcon.className = 'fas fa-volume-up';
                soundLabel.textContent = 'Suara: ON';
            }
        });

        // ============================================================
        // AUTOPLAY + FALLBACK
        // ============================================================
        video.play().catch(function(err) {
            console.warn('Autoplay gagal:', err);
            videoContainer.addEventListener('click', function playOnce() {
                video.play().catch(function(e) {});
                videoContainer.removeEventListener('click', playOnce);
            }, { once: true });
        });

        // ============================================================
        // FALLBACK: KALO VIDEO GAK JALAN DALAM 10 DETIK → SKIP PAKSA
        // ============================================================
        let fallbackTimer = setTimeout(function() {
            if (video.currentTime === 0 && !isRedirecting && !hasError) {
                console.warn('Video not playing, forcing skip...');
                goToDashboard();
            }
        }, 10000);

        video.addEventListener('playing', function() {
            clearTimeout(fallbackTimer);
        });

        // ============================================================
        // DISABLE KEYBOARD
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
            }
        });

        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>

</body>
</html>
