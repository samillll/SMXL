<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SMXL - Video</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        body {
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .video-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .video-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #0a0a0a;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.15);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .loading i {
            font-size: 32px;
            color: #ff6b00;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading.hidden {
            opacity: 0;
        }

        .skip-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 10px 22px;
            color: rgba(255, 255, 255, 0.4);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        .skip-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .skip-btn:active {
            transform: scale(0.95);
        }

        .skip-btn i {
            margin-right: 6px;
        }

        .tap-indicator {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            color: rgba(255, 255, 255, 0.06);
            font-size: 11px;
            font-family: 'Inter', sans-serif;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulse 2.5s ease infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%,
            100% { opacity: 0.05; }
            50% { opacity: 0.2; }
        }

        .error-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.1);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .error-msg i {
            font-size: 40px;
            color: #ff4444;
            opacity: 0.3;
            display: block;
            margin-bottom: 8px;
        }

        .error-msg.show {
            display: block;
        }

        @media (max-width: 480px) {
            .skip-btn {
                top: 16px;
                right: 16px;
                padding: 8px 16px;
                font-size: 12px;
            }
            .tap-indicator {
                bottom: 30px;
                font-size: 10px;
            }
            .loading i {
                font-size: 28px;
            }
        }
    </style>

    <script>
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 'i' || e.key === 'j')) {
                e.preventDefault();
                return false;
            }
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
        });
        document.addEventListener('touchstart', function() {}, { passive: true });
    </script>
</head>
<body>

    <div class="video-container" id="videoContainer">

        <!-- LOADING -->
        <div class="loading" id="loading">
            <i class="fas fa-spinner"></i>
            <span>Memuat video...</span>
        </div>

        <!-- ERROR -->
        <div class="error-msg" id="errorMsg">
            <i class="fas fa-exclamation-triangle"></i>
            <span>Gagal memuat video<br>Klik SKIP untuk melanjutkan</span>
        </div>

        <!-- VIDEO — MULTIPLE SOURCE -->
        <video id="introVideo" preload="auto" playsinline>
            <!-- SOURCE 1: URL LO -->
            <source src="https://videotourl.com/videos/1788563768147-b276a4ee-cb6d-4da6-ad85-9f6bfbad7e20.mp4" type="video/mp4" />
            <!-- SOURCE 2: FALLBACK (PASTI JALAN) -->
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" type="video/mp4" />
        </video>
    </div>

    <!-- SKIP -->
    <button class="skip-btn" id="skipBtn">
        <i class="fas fa-forward"></i> SKIP
    </button>

    <!-- TAP -->
    <div class="tap-indicator">
        <i class="fas fa-hand-pointer"></i> Tap anywhere to skip
    </div>

    <script>
        // ============================================================
        // CEK SESSION
        // ============================================================
        const username = sessionStorage.getItem('smxl_user');
        if (!username) {
            window.location.href = 'index.html';
        }

        // ============================================================
        // REFS
        // ============================================================
        const video = document.getElementById('introVideo');
        const skipBtn = document.getElementById('skipBtn');
        const videoContainer = document.getElementById('videoContainer');
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('errorMsg');

        let isRedirecting = false;
        let hasError = false;

        // ============================================================
        // SKIP KE DASHBOARD
        // ============================================================
        function goToDashboard() {
            if (isRedirecting) return;
            isRedirecting = true;
            window.location.href = 'dashboard.html';
        }

        skipBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            goToDashboard();
        });

        videoContainer.addEventListener('click', function() {
            goToDashboard();
        });

        video.addEventListener('ended', function() {
            goToDashboard();
        });

        // ============================================================
        // VIDEO MULAI PLAY → HIDE LOADING
        // ============================================================
        video.addEventListener('playing', function() {
            loading.classList.add('hidden');
            errorMsg.classList.remove('show');
            hasError = false;
        });

        // ============================================================
        // VIDEO ERROR → TAMPILKAN ERROR + FALLBACK
        // ============================================================
        video.addEventListener('error', function(e) {
            console.warn('Video error:', e);
            if (hasError) return;
            hasError = true;

            loading.classList.add('hidden');

            // COBA FALLBACK KE SOURCE KEDUA
            const sources = video.querySelectorAll('source');
            if (sources.length > 1 && video.src !== sources[1].src) {
                video.src = sources[1].src;
                video.load();
                video.play().catch(function() {});
                loading.classList.remove('hidden');
                hasError = false;
                return;
            }

            // KALO FALLBACK JUGA GAGAL → TAMPILKAN ERROR
            errorMsg.classList.add('show');

            // AUTO SKIP SETELAH 3 DETIK
            setTimeout(function() {
                if (!isRedirecting) {
                    goToDashboard();
                }
            }, 3000);
        });

        // ============================================================
        // AUTOPLAY
        // ============================================================
        video.play().catch(function(err) {
            console.warn('Autoplay gagal:', err);
            // Tunggu user tap
            videoContainer.addEventListener('click', function playOnce() {
                video.play().catch(function(e) {});
                videoContainer.removeEventListener('click', playOnce);
            }, { once: true });
        });

        // ============================================================
        // FALLBACK: KALO VIDEO GAK JALAN DALAM 8 DETIK → SKIP PAKSA
        // ============================================================
        let fallbackTimer = setTimeout(function() {
            if (video.currentTime === 0 && !isRedirecting && !hasError) {
                console.warn('Video not playing, forcing skip...');
                goToDashboard();
            }
        }, 8000);

        video.addEventListener('playing', function() {
            clearTimeout(fallbackTimer);
        });

        // ============================================================
        // DISABLE KEYBOARD
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
            }
        });

        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
    </script>

</body>
</html>
