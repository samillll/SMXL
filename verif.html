<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMXL - Verifikasi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent !important;
            -webkit-touch-callout: none !important;
            outline: none !important;
        }

        ::selection {
            background: transparent;
        }
        ::-moz-selection {
            background: transparent;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent !important;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(255, 107, 0, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 50%, rgba(255, 107, 0, 0.05) 0%, transparent 60%);
            animation: rotateGlow 20s linear infinite;
            z-index: 0;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .card {
            background: rgba(16, 16, 16, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 107, 0, 0.25);
            border-radius: 32px;
            padding: 48px 40px 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 60px rgba(255, 107, 0, 0.05);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .card:hover {
            transform: translateY(-4px) scale(1.01);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            font-size: 48px;
            color: #ff6b00;
            display: inline-block;
            background: rgba(255, 107, 0, 0.12);
            padding: 18px;
            border-radius: 24px;
            margin-bottom: 12px;
            box-shadow: 0 0 40px rgba(255, 107, 0, 0.1);
        }

        .logo-area h1 {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b00, #ff8c38);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .logo-area .subtitle {
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .verif-section {
            margin: 18px 0 24px;
            text-align: center;
        }

        .verif-section .verif-label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: block;
        }

        .fingerprint-btn {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 107, 0, 0.06);
            border: 2px solid rgba(255, 107, 0, 0.15);
            color: rgba(255, 255, 255, 0.2);
            font-size: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            user-select: none;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        .fingerprint-btn:hover {
            border-color: rgba(255, 107, 0, 0.3);
            background: rgba(255, 107, 0, 0.08);
        }

        .fingerprint-btn.active {
            border-color: #ff6b00;
            background: rgba(255, 107, 0, 0.15);
            color: #ff6b00;
            box-shadow: 0 0 60px rgba(255, 107, 0, 0.15);
            animation: pulse 1s ease infinite;
        }

        .fingerprint-btn.verified {
            border-color: #00c853;
            background: rgba(0, 200, 83, 0.12);
            color: #00c853;
            box-shadow: 0 0 60px rgba(0, 200, 83, 0.1);
            animation: none;
        }

        @keyframes pulse {
            0%,
            100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .fingerprint-btn .progress-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #ff6b00;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .fingerprint-btn.active .progress-ring {
            opacity: 1;
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .verif-status {
            margin-top: 12px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.25);
            transition: color 0.3s ease;
            min-height: 22px;
            font-weight: 500;
        }

        .verif-status.success {
            color: #00c853;
        }

        .verif-status.fail {
            color: #ff4444;
        }

        .btn-skip {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
            -webkit-tap-highlight-color: transparent !important;
            outline: none !important;
        }

        .btn-skip:hover {
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
        }

        .btn-skip:active {
            transform: scale(0.97);
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.12);
            font-size: 11px;
            letter-spacing: 1px;
        }

        .footer span {
            color: #ff6b00;
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 20px 28px;
                border-radius: 24px;
            }
            .logo-area h1 {
                font-size: 24px;
            }
            .fingerprint-btn {
                width: 80px;
                height: 80px;
                font-size: 32px;
            }
        }
    </style>

    <script>
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 'c' || e.key === 'u' || e.key === 'i' || e.key === 'j')) {
                e.preventDefault();
                return false;
            }
            if (e.key === 'F12') {
                e.preventDefault();
                return false;
            }
        });
        document.addEventListener('touchstart', function() {}, { passive: true });
    </script>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <div class="logo-area">
                <div class="logo-icon"><i class="fas fa-fingerprint"></i></div>
                <h1>Verifikasi</h1>
                <div class="subtitle">Scan Jempol</div>
            </div>

            <div class="verif-section">
                <span class="verif-label">
                    <i class="fas fa-hand"></i> Tahan Jempol 3 Detik
                </span>
                <div class="fingerprint-btn" id="fingerprintBtn">
                    <i class="fas fa-fingerprint"></i>
                    <div class="progress-ring"></div>
                </div>
                <div class="verif-status" id="verifStatus">Tekan & tahan jempol</div>
            </div>

            <button class="btn-skip" id="skipBtn">
                <i class="fas fa-forward"></i> Lewati Verifikasi
            </button>

            <div class="footer">
                <i class="fas fa-code"></i> created by <span>SAMIL</span>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // STATE
        // ============================================================
        let isVerified = false;
        let holdInterval = null;
        let holdDuration = 0;
        const REQUIRED_HOLD = 3000;

        // ============================================================
        // REFS
        // ============================================================
        const fingerprintBtn = document.getElementById('fingerprintBtn');
        const verifStatus = document.getElementById('verifStatus');
        const skipBtn = document.getElementById('skipBtn');

        // ============================================================
        // CEK SESSION
        // ============================================================
        const username = sessionStorage.getItem('smxl_user');
        if (!username) {
            window.location.href = 'index.html';
        }

        // ============================================================
        // FINGERPRINT HOLD
        // ============================================================
        fingerprintBtn.addEventListener('mousedown', startHold);
        fingerprintBtn.addEventListener('touchstart', startHold);
        fingerprintBtn.addEventListener('mouseup', endHold);
        fingerprintBtn.addEventListener('touchend', endHold);
        fingerprintBtn.addEventListener('mouseleave', endHold);

        function startHold(e) {
            e.preventDefault();
            if (isVerified) return;

            holdDuration = 0;
            fingerprintBtn.classList.add('active');
            verifStatus.textContent = '⏳ Tahan jempol... 0%';
            verifStatus.className = 'verif-status';

            holdInterval = setInterval(() => {
                holdDuration += 100;
                const progress = Math.min(100, Math.round((holdDuration / REQUIRED_HOLD) * 100));
                verifStatus.textContent = `⏳ Tahan jempol... ${progress}%`;

                if (holdDuration >= REQUIRED_HOLD) {
                    clearInterval(holdInterval);
                    holdInterval = null;
                    verifySuccess();
                }
            }, 100);
        }

        function endHold(e) {
            if (isVerified) return;
            if (holdInterval) {
                clearInterval(holdInterval);
                holdInterval = null;
            }
            fingerprintBtn.classList.remove('active');
            if (!isVerified) {
                verifStatus.textContent = '❌ Scan gagal! Coba lagi.';
                verifStatus.className = 'verif-status fail';
                setTimeout(() => {
                    verifStatus.textContent = 'Tekan & tahan jempol';
                    verifStatus.className = 'verif-status';
                }, 2000);
            }
        }

        function verifySuccess() {
            isVerified = true;
            fingerprintBtn.classList.remove('active');
            fingerprintBtn.classList.add('verified');
            verifStatus.textContent = '✅ Verifikasi berhasil!';
            verifStatus.className = 'verif-status success';

            setTimeout(() => {
                window.location.href = 'video.html';
            }, 800);
        }

        // ============================================================
        // SKIP
        // ============================================================
        skipBtn.addEventListener('click', function() {
            window.location.href = 'video.html';
        });
    </script>
</body>
</html>
