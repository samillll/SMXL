<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMXL - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(255, 107, 0, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 50%, rgba(255, 107, 0, 0.05) 0%, transparent 60%);
            animation: rotateGlow 20s linear infinite;
            z-index: 0;
        }
        @keyframes rotateGlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .wrapper { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 20px; }
        .card {
            background: rgba(16, 16, 16, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 107, 0, 0.25);
            border-radius: 32px;
            padding: 48px 40px 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 60px rgba(255, 107, 0, 0.05);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .card:hover { transform: translateY(-4px) scale(1.01); }
        .logo-area { text-align: center; margin-bottom: 28px; }
        .logo-icon {
            font-size: 48px;
            color: #ff6b00;
            display: inline-block;
            background: rgba(255, 107, 0, 0.12);
            padding: 18px;
            border-radius: 24px;
            margin-bottom: 12px;
            box-shadow: 0 0 40px rgba(255, 107, 0, 0.1);
        }
        .logo-area h1 {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b00, #ff8c38);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        .logo-area .subtitle {
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 4px;
        }
        .verif-section { margin: 18px 0 24px; text-align: center; }
        .verif-section .verif-label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
            display: block;
        }
        .fingerprint-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(255, 107, 0, 0.06);
            border: 2px solid rgba(255, 107, 0, 0.15);
            color: rgba(255, 255, 255, 0.2);
            font-size: 36px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            user-select: none;
        }
        .fingerprint-btn:hover { border-color: rgba(255, 107, 0, 0.3); background: rgba(255, 107, 0, 0.08); }
        .fingerprint-btn.active {
            border-color: #ff6b00;
            background: rgba(255, 107, 0, 0.15);
            color: #ff6b00;
            box-shadow: 0 0 60px rgba(255, 107, 0, 0.15);
            animation: pulse 1s ease infinite;
        }
        .fingerprint-btn.verified {
            border-color: #00c853;
            background: rgba(0, 200, 83, 0.12);
            color: #00c853;
            box-shadow: 0 0 60px rgba(0, 200, 83, 0.1);
            animation: none;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .fingerprint-btn .progress-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #ff6b00;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .fingerprint-btn.active .progress-ring { opacity: 1; animation: spin 1.5s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .verif-status {
            margin-top: 12px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.25);
            transition: color 0.3s ease;
            min-height: 20px;
        }
        .verif-status.success { color: #00c853; }
        .verif-status.fail { color: #ff4444; }
        .input-group { position: relative; margin-bottom: 14px; }
        .input-group .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 16px;
            transition: color 0.3s ease;
            pointer-events: none;
        }
        .input-group input {
            width: 100%;
            padding: 14px 20px 14px 48px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            outline: none;
            font-family: 'Inter', sans-serif;
        }
        .input-group input::placeholder { color: rgba(255, 255, 255, 0.15); font-weight: 400; }
        .input-group input:focus {
            border-color: #ff6b00;
            background: rgba(255, 107, 0, 0.05);
            box-shadow: 0 0 30px rgba(255, 107, 0, 0.05);
        }
        .input-group input:focus~.input-icon { color: #ff6b00; }
        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ff6b00, #e65c00);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 8px 40px rgba(255, 107, 0, 0.3); }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary .btn-icon { margin-right: 8px; }
        .msg {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            margin-top: 12px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .msg.show { display: flex; }
        .msg.error { background: rgba(255, 68, 68, 0.08); border: 1px solid rgba(255, 68, 68, 0.12); color: #ff4444; }
        .msg.success { background: rgba(0, 200, 83, 0.08); border: 1px solid rgba(0, 200, 83, 0.12); color: #00c853; }
        .footer { text-align: center; margin-top: 20px; color: rgba(255, 255, 255, 0.12); font-size: 11px; letter-spacing: 1px; }
        .footer span { color: #ff6b00; font-weight: 600; }
        .footer .note { color: rgba(255, 255, 255, 0.08); font-size: 10px; margin-top: 6px; line-height: 1.5; }
        @media (max-width: 480px) {
            .card { padding: 32px 20px 28px; border-radius: 24px; }
            .logo-area h1 { font-size: 26px; }
            .fingerprint-btn { width: 80px; height: 80px; font-size: 32px; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <div class="logo-area">
                <div class="logo-icon"><i class="fas fa-bolt"></i></div>
                <h1>SMXL</h1>
                <div class="subtitle">Super Max Level</div>
            </div>

            <div class="verif-section">
                <span class="verif-label"><i class="fas fa-fingerprint"></i> Verifikasi</span>
                <div class="fingerprint-btn" id="fingerprintBtn">
                    <i class="fas fa-fingerprint"></i>
                    <div class="progress-ring"></div>
                </div>
                <div class="verif-status" id="verifStatus">Scan jempol untuk verifikasi</div>
            </div>

            <form id="loginForm" autocomplete="off">
                <div class="input-group">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="loginUsername" placeholder="Masukan Username" required />
                </div>
                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="loginPassword" placeholder="Masukan Password" required />
                </div>
                <button type="submit" class="btn-primary">
                    <i class="fas fa-sign-in-alt btn-icon"></i> LOGIN
                </button>
                <div class="msg" id="loginMsg"></div>
            </form>

            <div class="footer">
                <i class="fas fa-code"></i> created by <span>SAMIL</span>
                <div class="note">
                    <i class="fas fa-info-circle"></i> Username & password bersifat pribadi, jangan disebar.
                    Jika disebarkan, akun akan diblokir.
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // KONFIGURASI — GANTI 1 BARIS INI!
        // ============================================================

        // GIST ID — ambil dari URL gist lo (32 karakter)
        const GIST_ID = 'add2762ede99be671309b45a3aa87e61';

        // RAW URL — buat baca data (otomatis pake GIST_ID)
        const GIST_RAW_URL = `https://gist.githubusercontent.com/samillll/${GIST_ID}/raw/data.json`;

        // ============================================================
        // STATE
        // ============================================================
        let isVerified = false;
        let holdInterval = null;
        let holdDuration = 0;
        const REQUIRED_HOLD = 3000;

        // ============================================================
        // REFS
        // ============================================================
        const fingerprintBtn = document.getElementById('fingerprintBtn');
        const verifStatus = document.getElementById('verifStatus');
        const loginForm = document.getElementById('loginForm');
        const loginMsg = document.getElementById('loginMsg');

        // ============================================================
        // FINGERPRINT HOLD
        // ============================================================
        fingerprintBtn.addEventListener('mousedown', startHold);
        fingerprintBtn.addEventListener('touchstart', startHold);
        fingerprintBtn.addEventListener('mouseup', endHold);
        fingerprintBtn.addEventListener('touchend', endHold);
        fingerprintBtn.addEventListener('mouseleave', endHold);

        function startHold(e) {
            e.preventDefault();
            if (isVerified) return;
            holdDuration = 0;
            fingerprintBtn.classList.add('active');
            verifStatus.textContent = '⏳ Tahan jempol... 0%';
            verifStatus.className = 'verif-status';
            holdInterval = setInterval(() => {
                holdDuration += 100;
                const progress = Math.min(100, Math.round((holdDuration / REQUIRED_HOLD) * 100));
                verifStatus.textContent = `⏳ Tahan jempol... ${progress}%`;
                if (holdDuration >= REQUIRED_HOLD) {
                    clearInterval(holdInterval);
                    holdInterval = null;
                    verifySuccess();
                }
            }, 100);
        }

        function endHold(e) {
            if (isVerified) return;
            if (holdInterval) {
                clearInterval(holdInterval);
                holdInterval = null;
            }
            fingerprintBtn.classList.remove('active');
            if (!isVerified) {
                verifStatus.textContent = '❌ Scan gagal! Coba lagi.';
                verifStatus.className = 'verif-status fail';
                setTimeout(() => {
                    verifStatus.textContent = 'Scan jempol untuk verifikasi';
                    verifStatus.className = 'verif-status';
                }, 2000);
            }
        }

        function verifySuccess() {
            isVerified = true;
            fingerprintBtn.classList.remove('active');
            fingerprintBtn.classList.add('verified');
            verifStatus.textContent = '✅ Verifikasi berhasil! Silahkan login.';
            verifStatus.className = 'verif-status success';
        }

        // ============================================================
        // FETCH DATA DARI GIST (PAKE RAW URL — GAK PAKE TOKEN!)
        // ============================================================
        async function fetchAccounts() {
            try {
                const res = await fetch(GIST_RAW_URL + '?t=' + Date.now());
                if (!res.ok) throw new Error('Gagal fetch data');
                const data = await res.json();
                return data.accounts || {};
            } catch (e) {
                console.warn('Gagal load data:', e);
                return {};
            }
        }

        // ============================================================
        // GET DEVICE ID
        // ============================================================
        function getDeviceId() {
            let id = localStorage.getItem('smxl_device_id');
            if (!id) {
                id = 'DEV_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 6);
                localStorage.setItem('smxl_device_id', id);
            }
            return id;
        }

        // ============================================================
        // LOGIN
        // ============================================================
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            loginMsg.classList.remove('show');

            if (!isVerified) {
                showMsg(loginMsg, '❌ Verifikasi jempol dulu!', 'error');
                return;
            }

            if (!username || !password) {
                showMsg(loginMsg, '❌ Username & Password harus diisi!', 'error');
                return;
            }

            const accounts = await fetchAccounts();

            if (!accounts[username]) {
                showMsg(loginMsg, '❌ Akun tidak ditemukan!', 'error');
                return;
            }

            if (accounts[username].password !== password) {
                showMsg(loginMsg, '❌ Password salah!', 'error');
                return;
            }

            const deviceId = getDeviceId();
            if (accounts[username].deviceId !== deviceId) {
                showMsg(loginMsg, '❌ Akun ini terdaftar di device lain! Jika ini kesalahan, hubungi admin.', 'error');
                return;
            }

            sessionStorage.setItem('smxl_user', username);
            sessionStorage.setItem('smxl_role', accounts[username].role || 'Member');
            sessionStorage.setItem('smxl_exp', accounts[username].exp || '0');

            window.location.href = 'dashboard.html';
        });

        function showMsg(el, text, type) {
            el.textContent = text;
            el.className = 'msg show ' + type;
        }
    </script>
</body>
</html>
