<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMXL - Login</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ========== RESET & GLOBAL ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated background glow */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 50%, rgba(255, 107, 0, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 50%, rgba(255, 107, 0, 0.05) 0%, transparent 60%);
            animation: rotateGlow 20s linear infinite;
            z-index: 0;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ========== LOGIN CONTAINER ========== */
        .login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: rgba(16, 16, 16, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 107, 0, 0.25);
            border-radius: 32px;
            padding: 48px 40px 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 60px rgba(255, 107, 0, 0.05);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease;
        }

        .login-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9), 0 0 80px rgba(255, 107, 0, 0.08);
        }

        /* ========== LOGO ========== */
        .logo-area {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            font-size: 48px;
            color: #ff6b00;
            display: inline-block;
            background: rgba(255, 107, 0, 0.12);
            padding: 18px;
            border-radius: 24px;
            margin-bottom: 12px;
            box-shadow: 0 0 40px rgba(255, 107, 0, 0.1);
        }

        .logo-area h1 {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(135deg, #ff6b00, #ff8c38);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .logo-area .subtitle {
            color: rgba(255, 255, 255, 0.35);
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* ========== INPUT ========== */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.25);
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .input-group input {
            width: 100%;
            padding: 16px 20px 16px 48px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 400;
        }

        .input-group input:focus {
            border-color: #ff6b00;
            background: rgba(255, 107, 0, 0.06);
            box-shadow: 0 0 30px rgba(255, 107, 0, 0.06);
        }

        .input-group input:focus+.input-icon,
        .input-group input:focus~.input-icon {
            color: #ff6b00;
        }

        .input-group input:focus~.input-icon {
            color: #ff6b00;
        }

        /* Fix icon position */
        .input-group .input-icon {
            pointer-events: none;
        }

        /* ========== BUTTON ========== */
        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff6b00, #e65c00);
            border: none;
            border-radius: 16px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
            margin-top: 8px;
        }

        .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 40px rgba(255, 107, 0, 0.35);
        }

        .btn-login:active {
            transform: scale(0.97);
        }

        .btn-login .btn-icon {
            margin-right: 10px;
        }

        /* ========== FOOTER ========== */
        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.15);
            font-size: 12px;
            letter-spacing: 1px;
        }

        .login-footer span {
            color: #ff6b00;
            font-weight: 600;
        }

        /* ========== ERROR ========== */
        .error-msg {
            color: #ff4444;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: rgba(255, 68, 68, 0.08);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 68, 68, 0.15);
        }

        .error-msg.show {
            opacity: 1;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 480px) {
            .login-card {
                padding: 32px 24px 28px;
                border-radius: 24px;
            }
            .logo-area h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">

            <!-- LOGO -->
            <div class="logo-area">
                <div class="logo-icon">
                    <i class="fas fa-bolt"></i>
                </div>
                <h1>SMXL</h1>
                <div class="subtitle">Super Max Level</div>
            </div>

            <!-- FORM -->
            <form id="loginForm" autocomplete="off">
                <div class="input-group">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="username" placeholder="Masukan Username" required />
                </div>

                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="Masukan Password" required />
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt btn-icon"></i> LOGIN
                </button>

                <div id="errorMsg" class="error-msg">
                    <i class="fas fa-exclamation-circle"></i> Username atau Password salah!
                </div>
            </form>

            <!-- FOOTER -->
            <div class="login-footer">
                <i class="fas fa-code"></i> created by <span>SAMIL</span>
            </div>

        </div>
    </div>

    <script>
        // ============================================================
        // LOGIN HANDLER
        // ============================================================
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('errorMsg');

            // Validasi sederhana
            if (username === '' || password === '') {
                errorEl.textContent = '⚠️ Username dan Password harus diisi!';
                errorEl.classList.add('show');
                return;
            }

            // Cek kredensial
            if (username === 'admin' && password === 'admin123') {
                // Simpan ke session storage
                sessionStorage.setItem('smxl_user', username);
                sessionStorage.setItem('smxl_role', 'Administrator');
                sessionStorage.setItem('smxl_exp', '12,847');

                // Redirect ke dashboard
                window.location.href = 'dashboard.html';
            } else if (username === 'user' && password === 'user123') {
                sessionStorage.setItem('smxl_user', username);
                sessionStorage.setItem('smxl_role', 'Member');
                sessionStorage.setItem('smxl_exp', '3,421');

                window.location.href = 'dashboard.html';
            } else if (username === 'samil' && password === 'samil123') {
                sessionStorage.setItem('smxl_user', username);
                sessionStorage.setItem('smxl_role', 'Developer');
                sessionStorage.setItem('smxl_exp', '99,999');

                window.location.href = 'dashboard.html';
            } else {
                errorEl.textContent = '❌ Username atau Password salah!';
                errorEl.classList.add('show');

                // Sembunyikan error setelah 3 detik
                setTimeout(() => {
                    errorEl.classList.remove('show');
                }, 3000);
            }
        });
    </script>

</body>
</html>
